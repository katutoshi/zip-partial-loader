name: Release

# tagpr が打ったタグ (vX.Y.Z) の push を契機に、ビルドして npm へ publish する。
# タグ打ち・GitHub Release 作成は .github/workflows/tagpr.yml が担当するため、
# ここでは build + npm publish のみを行う。
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Build and publish to npm
    runs-on: ubuntu-latest
    # npm publish 用に setup-node が書き出す ~/.npmrc + NODE_AUTH_TOKEN の仕組みを使う。
    # タグ push は人間の介在なしに走るが、タグは immutable なので冪等性が担保される。
    env:
      WASM_PACK_VERSION: v0.13.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup-node の cache: pnpm を有効にするため setup-node より前に pnpm を入れる。
      # release.yml は NODE_AUTH_TOKEN (npm publish 用) を持ち込むため、
      # pnpm/action-setup も SHA pin する。
      # b906affcce14559ad1aafd4ab0e942779e9f58b1 は v4.3.0 annotated tag の指すコミット。
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install Rust toolchain (rust-toolchain.toml)
        working-directory: wasm
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      - name: Install wasm-pack (pinned)
        run: |
          set -euo pipefail
          tarball="wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          url="https://github.com/rustwasm/wasm-pack/releases/download/${WASM_PACK_VERSION}/${tarball}"
          tmp="$(mktemp -d)"
          curl -sSfL -o "${tmp}/${tarball}" "${url}"
          tar -xzf "${tmp}/${tarball}" -C "${tmp}"
          sudo install -m 0755 "${tmp}/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack" /usr/local/bin/wasm-pack
          wasm-pack --version

      - name: Install wasm-opt (binaryen)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test:run

      # publish の prepack が build を行うが、wasm-opt 未インストール時に未最適化バイナリが
      # tgz に混入する事故を防ぐため、publish 前にあらかじめ wasm をビルドしておく (fail fast)。
      - name: Build wasm (fail fast)
        run: ./wasm/build.sh

      - name: Publish to npm
        env:
          # setup-node の registry-url 経由で ~/.npmrc に流し込まれる
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # prepack (pnpm run build: wasm + ts) が実行されたうえで publish される。
        # --no-git-checks は CI 上で git 状態を検証しないようにするため。
        run: pnpm publish --no-git-checks
