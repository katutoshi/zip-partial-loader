name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint / Type check / Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests
        run: npm run test:coverage

  build:
    name: Build (wasm + webpack)
    runs-on: ubuntu-latest
    env:
      WASM_PACK_VERSION: v0.13.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm

      - name: Install wasm-pack (pinned)
        run: |
          set -euo pipefail
          tarball="wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          url="https://github.com/rustwasm/wasm-pack/releases/download/${WASM_PACK_VERSION}/${tarball}"
          tmp="$(mktemp -d)"
          curl -sSfL -o "${tmp}/${tarball}" "${url}"
          tar -xzf "${tmp}/${tarball}" -C "${tmp}"
          sudo install -m 0755 "${tmp}/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack" /usr/local/bin/wasm-pack
          wasm-pack --version

      - name: Install wasm-opt (binaryen)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Install dependencies
        run: npm ci

      - name: Cargo test (native)
        working-directory: wasm
        run: cargo test

      - name: Build wasm (fail fast)
        run: ./wasm/build.sh

      - name: Build (webpack, production)
        env:
          NODE_ENV: production
        run: npm run build
