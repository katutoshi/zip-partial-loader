name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint / Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup-node の cache: pnpm を有効にするため setup-node より前に pnpm を入れる。
      # version は指定せず、package.json の packageManager フィールド (sha 付き pnpm@x.y.z)
      # から自動解決させる。lockfile と実行系のバージョンをここで一致させておかないと
      # `pnpm install --frozen-lockfile` が別バージョンでの再計算を要求して失敗する。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm run lint

      # `tsc --noEmit` はこの check ジョブでは走らせない。
      # 統合後の tsconfig.json は src/lszlw/lszr-wrapper.ts 経由で wasm/pkg/lszr.js
      # の d.ts を参照するため、wasm-pack ビルドが済んでいない環境では
      # `Cannot find module '../../wasm/pkg/lszr.js'` で必ず落ちる。
      # 型検査は build ジョブ (wasm ビルド直後) に単一の真実として置き、
      # ここで stub d.ts を手当てして "黙って古い産物を再利用する" 事故経路を
      # 作らない。fast-feedback は失うが、unit tests が同じコードパスを叩くので
      # 致命的な回帰は Unit tests ステップで検出可能。
      - name: Unit tests
        run: pnpm run test:coverage

  build:
    name: Build (wasm + tsc)
    runs-on: ubuntu-latest
    env:
      WASM_PACK_VERSION: v0.13.1
      BINARYEN_VERSION: version_116
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # rust toolchain は wasm/rust-toolchain.toml を単一の真実にする。
      # ubuntu-latest ランナーには rustup が pre-installed されているので、
      # 追加の action は使わず `rustup show` に任せる (未インストールの
      # toolchain は rustup がここで自動 fetch する)。
      # release.yml が secrets を扱う都合で「サードパーティ action は
      # 極力減らす」方針との整合も取れる。
      # 前提: `rustup toolchain install` を引数無しで叩けるのは rustup >= 1.28。
      # 2026-08 時点で ubuntu-24.04 の rustup は 1.29 系なので現状問題ないが、
      # 将来ランナーがダウングレードしたら明示引数版に切り替える。
      - name: Install Rust toolchain (rust-toolchain.toml)
        working-directory: wasm
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm

      # 品質ゲート: 既存指摘は事前に潰し済み。fmt/clippy を CI で守り、
      # 以降新規に混入する差分をブロックする。
      - name: Rustfmt check
        working-directory: wasm
        run: cargo fmt --all --check

      - name: Clippy (host, all targets, deny warnings)
        working-directory: wasm
        run: cargo clippy --all-targets -- -D warnings

      # wasm32 ターゲットの clippy も回す。tests/web.rs は
      # `#![cfg(target_arch = "wasm32")]` で host からは丸ごと除外されるため、
      # host clippy だけだと wasm32 でのみ発生する違反 (例: 定数 assert_eq!
      # による clippy::eq_op) を検知できない死角がある。
      - name: Clippy (wasm32, all targets, deny warnings)
        working-directory: wasm
        run: cargo clippy --all-targets --target wasm32-unknown-unknown -- -D warnings

      - name: Install wasm-pack (pinned)
        run: |
          set -euo pipefail
          tarball="wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          url="https://github.com/rustwasm/wasm-pack/releases/download/${WASM_PACK_VERSION}/${tarball}"
          tmp="$(mktemp -d)"
          curl -sSfL -o "${tmp}/${tarball}" "${url}"
          tar -xzf "${tmp}/${tarball}" -C "${tmp}"
          sudo install -m 0755 "${tmp}/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack" /usr/local/bin/wasm-pack
          wasm-pack --version

      # Binaryen (wasm-opt) を tarball で pin する (issue #24 参照)。
      # release.yml と同じ手順を CI 側でも踏み、CI が緑になった状態と release が
      # 使う wasm-opt を一致させる。生成 wasm が壊れた場合は build.sh 末尾の
      # verify-exports.py が非ゼロで exit してビルド全体を落とす。
      - name: Install wasm-opt (binaryen, pinned)
        run: |
          set -euo pipefail
          tarball="binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          url="https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/${tarball}"
          tmp="$(mktemp -d)"
          curl -sSfL -o "${tmp}/${tarball}" "${url}"
          tar -xzf "${tmp}/${tarball}" -C "${tmp}"
          sudo install -m 0755 "${tmp}/binaryen-${BINARYEN_VERSION}/bin/wasm-opt" /usr/local/bin/wasm-opt
          wasm-opt --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cargo test (native)
        working-directory: wasm
        run: cargo test

      - name: Build wasm (fail fast)
        run: ./wasm/build.sh

      # tsconfig.json は wasm/pkg 側の d.ts を参照するため、wasm ビルドが
      # 済んでいるこの build ジョブでのみ全体の tsc --noEmit を通せる
      # (check ジョブには wasm/pkg が無い)。
      - name: Type check (tsc --noEmit, full)
        run: pnpm exec tsc --noEmit

      # 0.12.x で webpack バンドルを廃止し、tsc 出力 + wasm-pack 生成物を
      # そのまま同梱する ESM 配布に切り替えたためこのステップは `pnpm build`
      # 一発で完結する (旧: `NODE_ENV=production` で webpack production 固定)。
      - name: Build (wasm + tsc)
        run: pnpm run build
