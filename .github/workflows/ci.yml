name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint / Type check / Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup-node の cache: pnpm を有効にするため setup-node より前に pnpm を入れる。
      # version は指定せず、package.json の packageManager フィールド (sha 付き pnpm@x.y.z)
      # から自動解決させる。lockfile と実行系のバージョンをここで一致させておかないと
      # `pnpm install --frozen-lockfile` が別バージョンでの再計算を要求して失敗する。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm run lint

      - name: Type check (tsc --noEmit)
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: Unit tests
        run: pnpm run test:coverage

  build:
    name: Build (wasm + webpack)
    runs-on: ubuntu-latest
    env:
      WASM_PACK_VERSION: v0.13.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # rust toolchain は wasm/rust-toolchain.toml を単一の真実にする。
      # ubuntu-latest ランナーには rustup が pre-installed されているので、
      # 追加の action は使わず `rustup show` に任せる (未インストールの
      # toolchain は rustup がここで自動 fetch する)。
      # release.yml が secrets を扱う都合で「サードパーティ action は
      # 極力減らす」方針との整合も取れる。
      - name: Install Rust toolchain (rust-toolchain.toml)
        working-directory: wasm
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm

      # 品質ゲート: 既存指摘は事前に潰し済み。fmt/clippy を CI で守り、
      # 以降新規に混入する差分をブロックする。
      - name: Rustfmt check
        working-directory: wasm
        run: cargo fmt --all --check

      - name: Clippy (all targets, deny warnings)
        working-directory: wasm
        run: cargo clippy --all-targets -- -D warnings

      - name: Install wasm-pack (pinned)
        run: |
          set -euo pipefail
          tarball="wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          url="https://github.com/rustwasm/wasm-pack/releases/download/${WASM_PACK_VERSION}/${tarball}"
          tmp="$(mktemp -d)"
          curl -sSfL -o "${tmp}/${tarball}" "${url}"
          tar -xzf "${tmp}/${tarball}" -C "${tmp}"
          sudo install -m 0755 "${tmp}/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack" /usr/local/bin/wasm-pack
          wasm-pack --version

      - name: Install wasm-opt (binaryen)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cargo test (native)
        working-directory: wasm
        run: cargo test

      - name: Build wasm (fail fast)
        run: ./wasm/build.sh

      # tsconfig.lszlw.json は wasm/pkg の型定義を前提とするため、
      # wasm ビルドが済んでいるこの build ジョブでしか実行できない
      # (check ジョブには wasm/pkg が無い)。
      - name: Type check (tsc --noEmit, lszlw)
        run: pnpm exec tsc --noEmit -p tsconfig.lszlw.json

      - name: Build (webpack, production)
        env:
          NODE_ENV: production
        run: pnpm run build
